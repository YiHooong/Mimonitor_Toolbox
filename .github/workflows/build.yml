name: Build Release

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Validate source
        shell: pwsh
        run: |
          python -m compileall -q monitor_controller.py mimonitor_toolbox

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v

  build:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Build exe (onefile)
        run: >-
          python -m nuitka --onefile --enable-plugin=pyqt6
          --windows-console-mode=disable
          --windows-icon-from-ico=assets/app/icon.ico
          --include-package=qfluentwidgets
          --include-package-data=qfluentwidgets
          --include-data-files=assets/runtime/adb.exe=assets/runtime/adb.exe
          --include-data-files=assets/runtime/AdbWinApi.dll=assets/runtime/AdbWinApi.dll
          --include-data-files=assets/runtime/AdbWinUsbApi.dll=assets/runtime/AdbWinUsbApi.dll
          --include-data-files=assets/runtime/MtkDirectTool.jar=assets/runtime/MtkDirectTool.jar
          --include-data-files=assets/runtime/ColorfulLedTool.jar=assets/runtime/ColorfulLedTool.jar
          --include-data-files=assets/adb_guardian/adbguardian-signed.apk=assets/adb_guardian/adbguardian-signed.apk
          --output-filename=MonitorToolbox.exe
          --output-dir=dist-nuitka
          --assume-yes-for-downloads
          monitor_controller.py

      - name: Build standalone
        run: >-
          python -m nuitka --standalone --enable-plugin=pyqt6
          --windows-console-mode=disable
          --windows-icon-from-ico=assets/app/icon.ico
          --include-package=qfluentwidgets
          --include-package-data=qfluentwidgets
          --include-data-files=assets/runtime/adb.exe=assets/runtime/adb.exe
          --include-data-files=assets/runtime/AdbWinApi.dll=assets/runtime/AdbWinApi.dll
          --include-data-files=assets/runtime/AdbWinUsbApi.dll=assets/runtime/AdbWinUsbApi.dll
          --include-data-files=assets/runtime/MtkDirectTool.jar=assets/runtime/MtkDirectTool.jar
          --include-data-files=assets/runtime/ColorfulLedTool.jar=assets/runtime/ColorfulLedTool.jar
          --include-data-files=assets/adb_guardian/adbguardian-signed.apk=assets/adb_guardian/adbguardian-signed.apk
          --output-filename=MonitorToolbox.exe
          --output-dir=dist-nuitka-standalone
          --assume-yes-for-downloads
          monitor_controller.py

      - name: Package portable zip
        shell: pwsh
        run: |
          Rename-Item dist-nuitka-standalone\monitor_controller.dist MonitorToolbox-portable
          Compress-Archive -Path dist-nuitka-standalone\MonitorToolbox-portable -DestinationPath MonitorToolbox-portable.zip
          Rename-Item dist-nuitka-standalone\MonitorToolbox-portable monitor_controller.dist

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" "installer\MonitorToolbox.iss"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-nuitka/MonitorToolbox.exe
            MonitorToolbox-portable.zip
            dist-installer/MonitorToolbox-Setup.exe
          generate_release_notes: true
